<html>
<head>
    <meta charset="UTF-8">
    <META HTTP-EQUIV="content-type" CONTENT="text/html; CHARSET=iso-8859-2">
    </head>
<body>
    <h1>Kod html</h1>
    <textarea rows="20" cols="200">
        <!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Prostokąt z gwiazdek</title>
</head>
<body>

<script>

var a_sol = parseInt(prompt("Podaj wysokość a="));
var b_sol = parseInt(prompt("Podaj szerokość b="));

for (var i_sol = 1; i_sol <= b_sol; i_sol++)
{
    document.write("*");
}
document.write("<br>");

var wiersz_sol = "*";

for (var i_sol = 1; i_sol <= (b_sol - 2); i_sol++)
{
    wiersz_sol = wiersz_sol + "&nbsp;&nbsp;";
}

wiersz_sol = wiersz_sol + "*";

for (var i_sol = 1; i_sol <= (a_sol - 2); i_sol++)
{
    document.write(wiersz_sol);
    document.write("<br>");
}

for (var i_sol = 1; i_sol <= b_sol; i_sol++)
{
    document.write("*");
}

</script>

</body>
</html>
</textarea>
</body>
</html>
