<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Rozkład ułamka egipskiego</title>
  <style>
    body {
      font-size: 38px;
      color: green;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

<script language="JavaScript">

var m_kow = prompt("Podaj wartość m_kow (liczba naturalna > 0):", "");

var m = parseInt(m_kow);

var m1 = m + 1;
var ulamek1 = "1/" + m1;
var ulamek2 = "1/" + (m * m1);

document.write("Rozkład ułamka egipskiego 1/" + m + " na dwa ułamki to:<br><br>");
document.write("1/" + m + " = " + ulamek1 + " + " + ulamek2);
</script>

</body>
</html>
