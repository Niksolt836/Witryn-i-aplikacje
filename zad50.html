<html lang="pl"> 
<head>  
   <meta charset="utf-8"> 
    <title>  Przykład użycia pętli </title> 
  <script language="JavaScript"> 
   for ( var i=1; i<=10; i++) 
    { 
       for ( var k=1; k<=i; k++) 
        { 
           document.write("&nbsp");     
         } 
         document.write(i+"<br>"); 
     } 
  </script> 
</head>  
<body>
<div style="color:red;font-size:50px;">
    <script language="JavaScript">
        do {
            var liczba1=prompt("n=","");
            var n_kow=parseFloat(liczba1);
        }
        while(n_kow<0);
        if(n_kow==0){silnia_kow=1;
            document.write("n-"+n_kow+"<br>"+n_kow+"!="+silnia_kow);
        }
        if(n_kow>0){silnia_kow=1;
            for(i_kow=1;i_kow<=n_kow;i_kow++)
        { silnia_kow=silnia_kow*i_kow;}
        document.write("n="+n_kow+"<br>"+n_kow+"!="+silnia_kow)
        }
    </script>
</div>  
</body>  
</html>
