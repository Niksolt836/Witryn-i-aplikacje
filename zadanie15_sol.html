<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Rozkład ułamka egipskiego na dwa takie same ułamki</title>
  <style>
    body {
      font-size: 38px;
      color: green;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

<script language="JavaScript">

var m_kow = prompt("Podaj wartość m_kow (liczba naturalna > 0):", "");
var m = parseInt(m_kow);

var mianownik = 2 * m;

document.write("Rozkład ułamka egipskiego 1/" + m + " na dwa takie same ułamki:<br><br>");
document.write("1/" + m + " = 1/" + mianownik + " + 1/" + mianownik);
</script>

</body>
</html>
