<html>
<head>
    <meta charset="UTF-8">
    <META HTTP-EQUIV="content-type" CONTENT="text/html; CHARSET=iso-8859-2">
    </head>
<body>
    <h1>Kod html</h1>
    <textarea rows="20" cols="200">
        <!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Modyfikacja pętli</title>
</head>
<body>

<script>

var ile_razy_sol = parseInt(prompt("Ile razy powtórzyć="));
var inicjaly_sol = prompt("Podaj twoje inicjały=");

for (var i_sol = 1; i_sol <= ile_razy_sol; i_sol++)
{
    for (var k_sol = 1; k_sol <= i_sol; k_sol++)
    {
        document.write("&nbsp;&nbsp;&nbsp;");
    }

    document.write(i_sol + "_" + inicjaly_sol + "_" + i_sol + "<br>");
}

</script>

</body>
</html>
</textarea>
</body>
</html>
