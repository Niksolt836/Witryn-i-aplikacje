<html>
<head>
    <meta charset="UTF-8">
    <META HTTP-EQUIV="content-type" CONTENT="text/html; CHARSET=iso-8859-2">
    </head>
<body>
    <h1>Kod html</h1>
    <textarea rows="20" cols="200">
        <!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Liczby nieparzyste</title>
</head>
<body>

<script>

var l1_sol = parseInt(prompt("Podaj pierwszą liczbę:"));
var l2_sol = parseInt(prompt("Podaj drugą liczbę:"));

if (l1_sol == l2_sol)
{
    confirm("Liczby są równe - brak obliczeń");
}
else if (l1_sol < l2_sol)
{
    for (var i_sol = l1_sol; i_sol <= l2_sol; i_sol++)
    {
        if (i_sol % 2 != 0)
        {
            document.write("<span style='color:green; font-size:20px;'>" + i_sol + "</span><br>");
        }
    }
}
else
{
    for (var i_sol = l1_sol; i_sol >= l2_sol; i_sol--)
    {
        if (i_sol % 2 != 0)
        {
            document.write("<span style='color:blue; font-size:10px;'>" + i_sol + "</span><br>");
        }
    }
}

</script>

</body>
</html>
</textarea>
</body>
</html>
