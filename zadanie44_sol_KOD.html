    <h1>Kod html</h1>
    <textarea rows="20" cols="200">
        <!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Imię i nazwisko na przemian</title>
</head>
<body>

<div id="wynik"></div>

<script>
    let koniec_petli_sol = 13;
    let wielkosc_liter_sol = 41;
    let wynik = "";

    wynik += "ilość wykonania pętli = " + koniec_petli_sol + "<br>";
    wynik += "wielkość liter = " + wielkosc_liter_sol + "px<br><br>";

    for (let i_s = 1; i_s <= koniec_petli_sol; i_s++) {
        if (i_s % 2 != 0) {
            wynik += "<span style='font-size:" + wielkosc_liter_sol + "px;'>Sołtysek</span><br>";
        } else {
            wynik += "<span style='font-size:" + wielkosc_liter_sol + "px;'>Nikodem</span><br>";
        }
    }

    document.getElementById("wynik").innerHTML = wynik;
</script>

</body>
</html>
</textarea>
</body>
