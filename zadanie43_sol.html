<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Liczby parzyste</title>
</head>
<body>

<h2>Liczby parzyste od 2 do podanej liczby</h2>
<div id="wynik"></div>

<script>
    let i_s;
    let koniec_petli_sol;

    i_s = prompt("Podaj liczbę końcową:");
    koniec_petli_sol = parseInt(i_s);

    let wynik = "";

    for (let i = 2; i <= koniec_petli_sol; i += 2) {
        wynik += i + "<br>";
    }

    document.getElementById("wynik").innerHTML = wynik;
</script>

</body>
</html>
