    <h1>Kod html</h1>
    <textarea rows="20" cols="200">
        <!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Szereg harmoniczny</title>
</head>
<body>

<h2>Suma szeregu harmonicznego od 1 do 1000000</h2>

<div id="wynik"></div>

<script>
    let suma_sol = 0;

    for (let i_sol = 1; i_sol <= 1000000; i_sol++) {
        suma_sol = suma_sol + 1 / i_sol;
    }

    document.getElementById("wynik").innerHTML =
        "Suma szeregu harmonicznego od 1 do 1000000 wynosi:<br><br>" +
        suma_sol;
</script>

</body>
