<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Rozkład ułamka egipskiego na trzy ułamki</title>
  <style>
    body {
      font-size: 38px;
      color: green;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

<script language="JavaScript">

var m_kow = prompt("Podaj wartość m_kow (liczba naturalna > 0):", "");
var m = parseInt(m_kow);

var m1 = m + 1;
var u1 = m1;           
var u2 = m * m1;       

var u1_1 = u1 + 1;             
var u1_2 = u1 * (u1 + 1);      

document.write("Rozkład ułamka egipskiego 1/" + m + " na trzy ułamki:<br><br>");
document.write("1/" + m + " = 1/" + u1_1 + " + 1/" + u1_2 + " + 1/" + u2);
</script>

</body>
</html>
