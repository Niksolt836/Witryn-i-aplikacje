<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>title</title>
</head>
<body style="background:linear-gradient(#5C9FD3,#F0DB8A)">
<div style="color:black;font-size:18px;">
    <script language="JavaScript">
        for(i=25;i<40;i++)
    {
        p_2_sol=Math.sqrt(i).toFixed(2);
        p_4_sol=Math.sqrt(p_2_sol).toFixed(2);
        document.write("i="+i);
        document.write("&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;");
        document.write("p_2=" +p_2_sol);
        document.write("&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;");
        document.write("p_4=" + p_4_sol+"<br>");
    }
    </script>
    </div>
</body>
</html>
