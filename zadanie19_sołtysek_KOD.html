<body>
    <h1>Kod html</h1>
    <textarea rows="20" cols="200">
    <html> 
 <head> 
  <meta charset="UTF-8"> 
  <link rel="stylesheet" href="styl.css"> 
 </head> 
<body> 
 <script type="text/javascript"> 
  function pole_sołtysek() 
   { 
 var a_sołtysek= parseFloat(document.getElementById('dlugosc').value); 
 var b_sołtysek= a_sołtysek*a_sołtysek; 
        document.getElementById("nazwa").innerHTML ="Pole kwadratu= "+b_sołtysek.toFixed(2)+" cm^2";  
   } 
  function obwod_sołtysek() 
   { 
 var a_sołtysek= parseFloat(document.getElementById('dlugosc').value); 
 var b_sołtysek= 4*a_sołtysek; 
        document.getElementById("nazwa").innerHTML ="Obwód kwadratu= "+b_sołtysek.toFixed(2)+" cm";  
   } 
 </script> 
  <h1>Wszystko o KWADRACIE</h1><br><br> 
  Podaj długość boku: <input type="text" id="dlugosc" value="podaj długość"> cm<br><br><br> 
  <input type="button" name="pole" value="Oblicz pole" Onclick="pole_sołtysek()"><br><br> 
  <input type="button" name="obwod" value="Oblicz obwod" Onclick="obwod_sołtysek()"><br><br> 
  <div  style="color:red;font-size:50px;"id="nazwa"></div> 
</body> 
</html> 
</textarea>
</body>
</html>
